name: Build Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ScreenToGif/ScreenToGif.csproj --runtime win-x64

      - name: Publish Windows package
        run: dotnet publish ScreenToGif/ScreenToGif.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/ScreenToGif-win-x64 -p:Platform=x64 -p:DebugSymbols=false -p:DebugType=None

      - name: Generate quick region icon
        shell: pwsh
        run: ./Other/GenerateQuickRegionIcon.ps1 -OutputPath QuickRegionLauncher/QuickRegion.ico

      - name: Build quick region launcher
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $visualStudio "VC\Auxiliary\Build\vcvars64.bat"
          $output = Join-Path $PWD "artifacts\ScreenToGif-win-x64\ScreenToGif-QuickRegion.exe"

          Push-Location QuickRegionLauncher
          try {
            $command = "call `"$vcvars`" && rc.exe /nologo QuickRegion.rc && cl.exe /nologo /O2 /EHsc /DUNICODE /D_UNICODE QuickRegion.cpp QuickRegion.res shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:`"$output`""
            cmd.exe /d /s /c $command

            if ($LASTEXITCODE -ne 0) {
              throw "Quick region launcher build failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ScreenToGif-win-x64-${{ github.sha }}
          path: artifacts/ScreenToGif-win-x64
          if-no-files-found: error
          retention-days: 14
