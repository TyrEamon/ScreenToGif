name: Build Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ScreenToGif/ScreenToGif.csproj --runtime win-x64

      - name: Publish Windows package
        run: dotnet publish ScreenToGif/ScreenToGif.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/ScreenToGif-win-x64 -p:Platform=x64 -p:DebugSymbols=false -p:DebugType=None

      - name: Generate quick region icon
        shell: pwsh
        run: ./Other/GenerateQuickRegionIcon.ps1 -OutputPath QuickRegionLauncher/QuickRegion.ico

      - name: Restore quick region launcher
        run: dotnet restore QuickRegionLauncher/QuickRegionLauncher.csproj --runtime win-x64

      - name: Publish quick region launcher
        run: dotnet publish QuickRegionLauncher/QuickRegionLauncher.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/QuickRegionLauncher

      - name: Add quick region launcher
        shell: pwsh
        run: Copy-Item artifacts/QuickRegionLauncher/ScreenToGif-QuickRegion.exe artifacts/ScreenToGif-win-x64/ScreenToGif-QuickRegion.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ScreenToGif-win-x64-${{ github.sha }}
          path: artifacts/ScreenToGif-win-x64
          if-no-files-found: error
          retention-days: 14
